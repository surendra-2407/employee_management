# ==========================================
# Employee Management System - Docker Compose
# Using MongoDB Atlas (cloud) — no local MongoDB container needed
# ==========================================

services:
  # ==========================================
  # Application Backend Tier: Node.js Express API
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: employee-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb+srv://suripallapothu18_db_user:7D76J467Vg62GVXG@cluster0.qmgmg6m.mongodb.net/employeedb?retryWrites=true&w=majority
      NODE_ENV: production
    ports:
      - "5000:5000"
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ==========================================
  # Client Frontend Tier: React.js + Tailwind (Nginx)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: employee-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80" # Maps host port 3000 to Nginx container port 80
    networks:
      - app-net

# ==========================================
# Custom Isolated Network
# ==========================================
networks:
  app-net:
    name: employee-app-network
    driver: bridge
